<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; frame-src https://accounts.google.com; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://accounts.google.com/gsi/; img-src 'self' data: blob: https://*.googleusercontent.com; font-src 'self'; worker-src 'self' blob:; base-uri 'self'; form-action 'self'"
    />
    <meta name="theme-color" content="#0c1426" />
    <meta name="description" content="Catatan uang masuk dan keluar pribadi, tersimpan di Google Sheets." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Money Tracker" />
    <title>Money Tracker</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <script src="config.js"></script>
    <script src="js/theme.js"></script>
    <link rel="preload" href="fonts/inter-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/shell.css" />
    <link rel="stylesheet" href="css/pages.css" />
    <link rel="stylesheet" href="css/materials.css" />
    <link rel="stylesheet" href="css/motion.css" />
    <script src="vendor/chart-4.4.7.umd.js" defer></script>
    <script type="module" src="js/app.js"></script>
  </head>
  <body class="is-gated">
    <div class="backdrop" aria-hidden="true"></div>

    <header class="topbar material">
      <div class="topbar__inner">
        <button type="button" class="brand" data-go="home">
          <span class="brand__logo"><svg class="icon" aria-hidden="true"><use href="icons/sprite.svg#trending-up"></use></svg></span>
          <span>
            <span class="brand__name">Money Tracker</span>
            <span class="brand__tagline" data-tagline></span>
          </span>
        </button>
        <button type="button" class="pill sync-pill" data-sync-pill hidden></button>
        <button type="button" class="btn btn--outline topbar__export" data-export></button>
        <button type="button" class="btn-circle" data-theme-toggle></button>
        <button type="button" class="btn-circle" data-go="settings" data-settings-button>
          <svg class="icon" aria-hidden="true"><use href="icons/sprite.svg#settings"></use></svg>
        </button>
      </div>
    </header>

    <main class="main">
      <div class="subbar">
        <nav class="navtabs" data-navtabs></nav>
        <button type="button" class="btn btn--primary" data-page-action></button>
      </div>
      <div data-root></div>
    </main>

    <nav class="tabbar material" data-tabbar></nav>

    <button type="button" class="fab" data-fab>
      <svg class="icon" aria-hidden="true"><use href="icons/sprite.svg#plus"></use></svg>
    </button>

    <div class="toasts" data-toasts></div>

    <dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
      <div class="sheet__inner" data-sheet-content></div>
    </dialog>

    <div class="gate" data-gate hidden></div>
  </body>
</html>
